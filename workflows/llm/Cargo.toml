[package]
name = "lightflow-rig-llm"
version = "0.1.0"
edition = "2024"
description = "LightFlow workflow for routing prompts through Rig to arbitrary LLM providers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lightjunction/lightflow-rig"

[package.metadata.lightflow]
runner = "lightflow-rig-llm-runner"

[[bin]]
name = "lightflow-rig-llm-runner"
path = "src/bin/runner.rs"

[dependencies]
lightflow = { workspace = true }
rig-core = { workspace = true }
tokio = { workspace = true }
